name: Drift

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Fetch swe-docs main
        run: git clone --quiet --depth 1 https://github.com/cs-clarence/swe-docs "$RUNNER_TEMP/swe-docs"
      - name: Validate skills against swe-docs main
        id: validate
        shell: bash
        run: python3 scripts/validate_skills.py --guidelines "$RUNNER_TEMP/swe-docs/docs/guidelines" | tee "$RUNNER_TEMP/report.txt"
      - name: Open issue on drift
        if: failure() && steps.validate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "Validation against swe-docs main failed:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/report.txt"
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/body.md"
          title="Skills drifted from swe-docs main"
          existing="$(gh issue list --state open --search "$title in:title" --json number,title | jq -r --arg t "$title" '[.[] | select(.title == $t)][0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
